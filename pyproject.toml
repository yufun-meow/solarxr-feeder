[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solarxr-feeder"
version = "0.1.0"
description = "Feed any pose source to WiVRn or Monado as SolarXR trackers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["flatbuffers>=2.0"]

[project.urls]
Homepage = "https://github.com/example/solarxr-feeder"

[project.scripts]
solarxr-feeder = "feeder:main"

[tool.setuptools]
py-modules = ["feeder"]

[tool.setuptools.packages.find]
include = ["solarxr_feeder*", "sources*"]
